<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Meme It | Home</title>
    <meta name="description" content="Home page of the I Meme It website. It's a meme generation site that allows you to BYOM (bring your own meme), select a trending one, or search for one you want to build right on the site.">
    <meta name="author" content="Spencer Rejas">

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    
    <script type="module" src="js/index.js"></script>
</head>

<body>
    <header id="base-header"></header>
    <main>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search for memes...">
            <button id="search-button">Search</button>
        </div>
        <section id="browse-results">
            <h2>Trending</h2>
            <ul class="meme-gallery">
                <!-- Meme items will be dynamically inserted here -->
            </ul>
        </section>
    </main>
    <footer id="base-footer"></footer>
</body>
</html>
